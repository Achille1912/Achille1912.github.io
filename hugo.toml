baseURL = "https://achillecannavale.dev/"
languageCode = "it"
title = "Achille Cannavale"
enableRobotsTXT = true

# La homepage è static/index.html scritta a mano: nessun contenuto Hugo,
# il sito è solo un passthrough di static/ (e dei PDF in documents/riassunti).
disableKinds = ["home", "taxonomy", "term"]

# PDF già presenti nel repo: montati come static senza spostarli.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "documents"
    target = "static/documents"
  [[module.mounts]]
    source = "riassunti"
    target = "static/riassunti"
