<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post — Achille Cannavale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f7f5f0; --text: #1a1a18; --muted: #888880; --line: #d8d5ce; }
    body { background: var(--bg); color: var(--text); font-family: 'EB Garamond', Georgia, serif; font-size: 18px; line-height: 1.7; padding: 0 1.5rem; }
    .container { max-width: 640px; margin: 0 auto; }

    nav { padding: 2.5rem 0 2rem; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); }
    nav .logo { font-family: 'DM Mono', monospace; font-size: 0.8rem; font-weight: 300; letter-spacing: 0.08em; color: var(--muted); text-decoration: none; }
    nav .nav-right { display: flex; align-items: baseline; gap: 1.8rem; }
    nav ul { list-style: none; display: flex; gap: 1.8rem; }
    nav a { font-family: 'DM Mono', monospace; font-size: 0.72rem; font-weight: 300; letter-spacing: 0.06em; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover { color: var(--text); }
    #lang-toggle { font-family: 'DM Mono', monospace; font-size: 0.72rem; font-weight: 300; letter-spacing: 0.06em; color: var(--text); background: transparent; border: 1px solid var(--line); padding: 0.18rem 0.55rem; border-radius: 2px; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
    #lang-toggle:hover { border-color: var(--muted); color: var(--muted); }

    .post-header { padding: 4rem 0 2.5rem; border-bottom: 1px solid var(--line); }
    .post-header h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 400; line-height: 1.2; margin-bottom: 0.6rem; }
    .post-meta { font-family: 'DM Mono', monospace; font-size: 0.68rem; font-weight: 300; color: var(--muted); }

    .post-body { padding: 3rem 0; }
    .post-body h1 { display: none; }
    .post-body h2 { font-size: 1.25rem; font-weight: 500; margin: 2.5rem 0 0.7rem; }
    .post-body h3 { font-size: 1.05rem; font-weight: 500; margin: 2rem 0 0.5rem; }
    .post-body p { margin-bottom: 1.1rem; }
    .post-body ul, .post-body ol { margin: 0.5rem 0 1.2rem 1.4rem; }
    .post-body li { margin-bottom: 0.35rem; }
    .post-body strong { font-weight: 500; }
    .post-body em { font-style: italic; }
    .post-body a { color: var(--text); }
    .post-body pre { background: #edeae3; border: 1px solid var(--line); border-radius: 3px; padding: 1rem 1.2rem; overflow-x: auto; margin: 1.2rem 0; }
    .post-body code { font-family: 'DM Mono', monospace; font-size: 0.78rem; font-weight: 300; }
    .post-body p code { background: #edeae3; padding: 0.1rem 0.35rem; border-radius: 2px; }

    .post-nav { border-top: 1px solid var(--line); padding: 2rem 0; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    .post-nav a { font-family: 'DM Mono', monospace; font-size: 0.72rem; font-weight: 300; letter-spacing: 0.06em; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .post-nav a:hover { color: var(--text); }

    footer { border-top: 1px solid var(--line); padding: 2rem 0 3rem; }
    footer p { font-family: 'DM Mono', monospace; font-size: 0.68rem; font-weight: 300; letter-spacing: 0.06em; color: var(--muted); }

    @media (max-width: 500px) { nav .nav-right { gap: 1.1rem; } nav ul { gap: 1.1rem; } }
  </style>
</head>
<body>
<div class="container">

  <nav>
    <a href="index.html" class="logo">AC</a>
    <div class="nav-right">
      <ul>
        <li><a href="blog.html" data-it="← Blog" data-en="← Blog">← Blog</a></li>
        <li><a href="index.html" data-it="Home" data-en="Home">Home</a></li>
      </ul>
      <button id="lang-toggle">EN</button>
    </div>
  </nav>

  <div class="post-header">
    <h1 id="post-title">—</h1>
    <p class="post-meta" id="post-meta">—</p>
  </div>

  <div class="post-body" id="post-body"></div>

  <div class="post-nav">
    <a href="blog.html" data-it="← Tutti i post" data-en="← All posts">← Tutti i post</a>
    <span id="post-nav-next"></span>
  </div>

  <footer><p>© 2025 Achille Cannavale</p></footer>

</div>
<script src="posts.js"></script>
<script>
  let lang = 'it';
  const toggleBtn = document.getElementById('lang-toggle');

  function parseMarkdown(md) {
    md = md.replace(/^---[\s\S]*?---\n?/, '');
    const lines = md.split('\n');
    let html = '', inCode = false, codeBuf = '', inUl = false;
    for (const l of lines) {
      if (l.startsWith('```')) {
        if (!inCode) { inCode = true; codeBuf = ''; }
        else { inCode = false; html += `<pre><code>${esc(codeBuf.replace(/\n$/,''))}</code></pre>`; }
        continue;
      }
      if (inCode) { codeBuf += l + '\n'; continue; }
      if (inUl && !l.startsWith('- ')) { html += '</ul>'; inUl = false; }
      if (!l.trim()) continue;
      if      (l.startsWith('### ')) html += `<h3>${inline(l.slice(4))}</h3>`;
      else if (l.startsWith('## '))  html += `<h2>${inline(l.slice(3))}</h2>`;
      else if (l.startsWith('# '))   html += `<h1>${inline(l.slice(2))}</h1>`;
      else if (l.startsWith('- '))   { if (!inUl) { html += '<ul>'; inUl = true; } html += `<li>${inline(l.slice(2))}</li>`; }
      else                           html += `<p>${inline(l)}</p>`;
    }
    if (inUl) html += '</ul>';
    return html;
  }
  function inline(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/`(.+?)`/g,'<code>$1</code>')
      .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');
  }
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function formatDate(iso) {
    const [y,m,d] = iso.split('-');
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1] + ' ' + +d + ', ' + y;
  }

  function applyLangStatic() {
    document.querySelectorAll('[data-it]').forEach(el => { el.innerHTML = el.getAttribute('data-' + lang); });
    toggleBtn.textContent = lang === 'it' ? 'EN' : 'IT';
    document.documentElement.lang = lang;
  }

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const idx = POSTS.findIndex(p => p.id === id);
  const post = POSTS[idx];

  async function render() {
    applyLangStatic();

    if (!post) {
      document.getElementById('post-title').textContent = '404';
      document.getElementById('post-body').innerHTML = '<p>Post non trovato.</p>';
      return;
    }

    const title = lang === 'it' ? post.title : post.title_en;
    document.title = title + ' — Achille Cannavale';
    document.getElementById('post-title').textContent = title;
    document.getElementById('post-meta').textContent = formatDate(post.date);

    // Fetch the .md file
    try {
      const res = await fetch(post.file);
      if (!res.ok) throw new Error();
      const md = await res.text();
      document.getElementById('post-body').innerHTML = parseMarkdown(md);
    } catch {
      document.getElementById('post-body').innerHTML = '<p style="color:var(--muted)">Impossibile caricare il post. Assicurati di aprire il sito tramite un server (es. <code>python3 -m http.server</code>).</p>';
    }

    // Next post link
    const next = POSTS[idx + 1];
    const nextEl = document.getElementById('post-nav-next');
    if (next) {
      nextEl.innerHTML = `<a href="post.html?id=${next.id}">${lang === 'it' ? next.title : next.title_en} →</a>`;
    }
  }

  toggleBtn.addEventListener('click', () => { lang = lang === 'it' ? 'en' : 'it'; render(); });

  render();
</script>
</body>
</html>
