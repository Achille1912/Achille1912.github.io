<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <title>Post</title>
    <script type="module" src="LoadMarkdown.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9f9f9;
            color: #1a1a1a;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        a.back-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #007acc;
            transition: color 0.2s;
        }

        a.back-link:hover {
            color: #005f99;
            text-decoration: underline;
        }

        h1,
        h2,
        h3 {
            color: #222;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: 600;
        }

        p {
            margin-bottom: 1em;
        }

        img {
            display: block;
            margin: 20px auto;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        code,
        pre {
            background-color: #eee;
            border-radius: 4px;
            padding: 0.2em 0.4em;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.95em;
        }

        pre {
            padding: 1em;
            overflow-x: auto;
            margin-bottom: 1.5em;
        }

        blockquote {
            border-left: 4px solid #ccc;
            color: #555;
            font-style: italic;
            margin: 1.5em 0;
            padding-left: 1em;
        }

        ul,
        ol {
            margin: 1em 0;
            padding-left: 1.3em;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 2em 0;
        }
    </style>
</head>

<body>
    <div id="post-container"></div>
    <script type="module">
        import { renderFullPost } from './LoadMarkdown.js';
        renderFullPost('post-container');
    </script>
</body>

</html>
