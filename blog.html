<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <title>Blog</title>
    <script type="module" src="LoadMarkdown.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>


    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #fafafa;
            color: #333;
        }

        h1 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #222;
        }

        .post-preview {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgb(0 0 0 / 0.1);
            padding: 20px;
            margin-bottom: 20px;
            transition: box-shadow 0.3s ease;
        }

        .post-preview:hover {
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.15);
        }

        .post-preview a {
            text-decoration: none;
            color: #007acc;
            transition: color 0.3s ease;
        }

        .post-preview a:hover {
            color: #005f99;
        }

        .post-preview h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .post-preview div {
            color: #555;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <h1>Blog</h1>
    <div id="posts"></div>
    <script type="module">
        import { renderPreviews } from './LoadMarkdown.js';
        renderPreviews('post-container');
    </script>
</body>

</html>
