<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mental Diff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f7f5f0; --text: #1a1a18; --muted: #888880; --line: #d8d5ce; }
    body { background: var(--bg); color: var(--text); font-family: 'EB Garamond', Georgia, serif; font-size: 18px; line-height: 1.7; padding: 0 1.5rem; }
    .container { max-width: 640px; margin: 0 auto; }

    nav { padding: 2.5rem 0 2rem; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); }
    nav .logo { font-family: 'DM Mono', monospace; font-size: 0.8rem; font-weight: 300; letter-spacing: 0.08em; color: var(--muted); text-decoration: none; }
    nav .nav-right { display: flex; align-items: baseline; gap: 1.8rem; }
    nav ul { list-style: none; display: flex; gap: 1.8rem; }
    nav a { font-family: 'DM Mono', monospace; font-size: 0.72rem; font-weight: 300; letter-spacing: 0.06em; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover { color: var(--text); }
    #lang-toggle { font-family: 'DM Mono', monospace; font-size: 0.72rem; font-weight: 300; letter-spacing: 0.06em; color: var(--text); background: transparent; border: 1px solid var(--line); padding: 0.18rem 0.55rem; border-radius: 2px; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
    #lang-toggle:hover { border-color: var(--muted); color: var(--muted); }

    .page-header { padding: 4rem 0 3rem; border-bottom: 1px solid var(--line); }
    .page-header h1 { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 400; line-height: 1.2; }
    .page-header h1 em { font-style: italic; color: var(--muted); }

    .post-item { padding: 1.6rem 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 1rem; }
    .post-item a { text-decoration: none; color: inherit; }
    .post-item:hover .post-title { text-decoration: underline; text-underline-offset: 3px; }
    .post-title { font-weight: 500; font-size: 1.05rem; display: block; margin-bottom: 0.25rem; }
    .post-excerpt { font-size: 0.92rem; color: var(--muted); }
    .post-date { font-family: 'DM Mono', monospace; font-size: 0.68rem; font-weight: 300; color: var(--muted); white-space: nowrap; align-self: start; padding-top: 0.2rem; }

    footer { border-top: 1px solid var(--line); padding: 2rem 0 3rem; margin-top: 3rem; }
    footer p { font-family: 'DM Mono', monospace; font-size: 0.68rem; font-weight: 300; letter-spacing: 0.06em; color: var(--muted); }

    @media (max-width: 500px) { nav .nav-right { gap: 1.1rem; } nav ul { gap: 1.1rem; } }
  </style>
</head>
<body>
<div class="container">

  <nav>
    <a href="index.html" class="logo">AC</a>
    <div class="nav-right">
      <ul>
        <li><a href="index.html" data-it="Home" data-en="Home">Home</a></li>
        <li><a href="index.html#contact" data-it="Contatti" data-en="Contact">Contatti</a></li>
      </ul>
      <button id="lang-toggle">EN</button>
    </div>
  </nav>

  <div class="page-header">
    <h1 data-it="Mental Diff" data-en="Mental Diff">Mental Diff</h1>
  </div>

  <div id="posts-list"></div>

  <footer><p>© 2026 Mental Diff</p></footer>

</div>
<script src="posts.js"></script>
<script>
  let lang = 'it';
  const toggleBtn = document.getElementById('lang-toggle');
  function applyLang() {
    document.querySelectorAll('[data-it]').forEach(el => { el.innerHTML = el.getAttribute('data-' + lang); });
    toggleBtn.textContent = lang === 'it' ? 'EN' : 'IT';
    document.documentElement.lang = lang;
    renderList();
  }
  toggleBtn.addEventListener('click', () => { lang = lang === 'it' ? 'en' : 'it'; applyLang(); });

  function formatDate(iso) {
    const [y,m,d] = iso.split('-');
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1] + ' ' + +d + ', ' + y;
  }

  function excerpt(md = '') {
    const text = md.replace(/^---[\s\S]*?---\n?/, '').replace(/#+\s.*/g, '').replace(/[`*_]/g, '').replace(/\n+/g, ' ').trim();
    return text ? text.slice(0, 120) + '…' : '';
  }

  function renderList() {
    document.getElementById('posts-list').innerHTML = POSTS.map(p => `
      <div class="post-item">
        <a href="post.html?id=${p.id}">
          <span class="post-title">${lang === 'it' ? p.title : p.title_en}</span>
          <span class="post-excerpt">${excerpt(p.content)}</span>
        </a>
        <span class="post-date">${formatDate(p.date)}</span>
      </div>`).join('');
  }

  renderList();
</script>
</body>
</html>
