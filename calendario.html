        }

        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .day {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .day:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .day.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .day.completed {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4CAF50;
        }

        .day-number {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .day-type {
            font-size: 0.8em;
            opacity: 0.8;
            margin-top: 5px;

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

            background: linear-gradient(135deg, #2c3e50, #4a235a);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .problem-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        .problem-description {
            margin-bottom: 20px;
            line-height: 1.6;
        }

            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            tab-size: 4;
            -moz-tab-size: 4;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }

        .tab-info {
            color: #888;
            font-size: 0.8em;
            margin-top: 5px;
            text-align: right;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .quiz-option {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;

        }

        let currentDay = null;

        // Inizializza il calendario
        function initCalendar() {
            const calendar = document.getElementById('calendar');
            const today = new Date();
            const currentDate = today.getDate();
            const currentMonth = today.getMonth() + 1; // Gennaio è 0

            // Pulisce il calendario esistente
            calendar.innerHTML = '';

            // Solo dicembre
            if (currentMonth < 11) {
                calendar.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Torna a dicembre per aprire il calendario!</p>';
                return;
            }

            for (let day = 1; day <= 24; day++) {
                const dayElement = document.createElement('div');
                const problem = problems[day];
                const typeIcon = problem?.type === 'programmazione' ? '💻' : '📚';
                const typeText = problem?.type === 'programmazione' ? 'Codice' : 'Quiz';

                dayElement.className = 'day';
                dayElement.innerHTML = `
                    <div class="day-number">${day}</div>
                    <div class="day-status">🔒</div>
                    <div class="day-type">${typeIcon} ${typeText}</div>
                    ${problem ? `<div class="type-badge">${typeIcon}</div>` : ''}
                `;

                if (day <= currentDate) {
                    dayElement.classList.remove('locked');
                    dayElement.classList.add('unlocked');
                    dayElement.querySelector('.day-status').textContent = '🎁';

                    // Controlla se il giorno è già completato
                    const completedDays = JSON.parse(localStorage.getItem('completedDays') || '[]');
                    if (completedDays.includes(day)) {
                        dayElement.classList.add('completed');
                        dayElement.querySelector('.day-status').textContent = '✅';
                    }

                    dayElement.addEventListener('click', () => openProblem(day));
                } else {
                    dayElement.classList.add('locked');
                }

                calendar.appendChild(dayElement);
            }
        }

        // Apri il problema del giorno selezionato
        function openProblem(day) {
            currentDay = day;
            const problem = problems[day];
            const completedDays = JSON.parse(localStorage.getItem('completedDays') || '[]');
            const isCompleted = completedDays.includes(day);
            selectedOption = null;

            if (!problem) {
                alert('Problema non ancora disponibile!');
                return;
            }

            const problemContent = document.getElementById('problemContent');

            if (isCompleted) {
                // Mostra la vista "completato" con la ricompensa
                showReward(problem.reward, day);
            } else if (problem.type === 'programmazione') {
                // Mostra la vista programmazione
                problemContent.innerHTML = `
                    <div class="problem-title">Giorno ${day}: ${problem.title} 💻</div>
                    <div class="problem-description">${problem.description}</div>
                    
                    <div class="code-editor">
                        <textarea id="codeInput" placeholder="Scrivi qui la tua soluzione..."></textarea>
                        <div class="tab-info">💡 Usa Tab per indentare</div>
                    </div>
                    
                    <div class="buttons">
                        <button class="run-btn" onclick="runCode()">Esegui Codice</button>
                        <button class="close-btn" onclick="closeModal()">Chiudi</button>
                    </div>
                    
                    <div id="output"></div>
                    <div class="reward-message" id="rewardMessage" style="display: none;"></div>
                `;

                // Aggiungi l'event listener per gestire i tab
                const textarea = document.getElementById('codeInput');
                textarea.addEventListener('keydown', handleTabKey);
            } else {
                // Mostra la vista quiz
                const optionsHTML = problem.options.map((option, index) => `
                    <div class="quiz-option" onclick="selectOption(${index})">
                        ${option}
                    </div>
                `).join('');

                problemContent.innerHTML = `
                    <div class="problem-title">Giorno ${day}: ${problem.title} 📚</div>
                    <div class="problem-description">${problem.description}</div>
                    
                    <div class="quiz-options" id="quizOptions">
                        ${optionsHTML}
                    </div>
                    
                    <div class="buttons">
                        <button class="submit-btn" onclick="submitQuiz()" disabled>Invia Risposta</button>
                        <button class="close-btn" onclick="closeModal()">Chiudi</button>
                    </div>
                    
                    <div id="output"></div>
                    <div class="reward-message" id="rewardMessage" style="display: none;"></div>
                `;
            }

            document.getElementById('problemModal').style.display = 'flex';
        }

        // Mostra la ricompensa
        function showReward(reward, day) {
            let rewardHTML = '';

            switch (reward.type) {
                case 'photo':
                    rewardHTML = `
                        <div class="completed-view">
                            <div class="completed-icon">📸</div>
                            <div class="problem-title">Giorno ${day}: ${reward.title}</div>
                            <div class="success" style="font-size: 1.2em;">${reward.description}</div>
                            <img src="${reward.content}" alt="Foto speciale" class="photo-reward" onerror="this.style.display='none'">
                           
                            <div style="margin-top: 20px;">
                                <button class="close-btn" onclick="closeModal()">Chiudi</button>
                            </div>
                        </div>
                    `;
                    break;

                case 'audio':
                    rewardHTML = `
                        <div class="completed-view">
                            <div class="completed-icon">🎵</div>
                            <div class="problem-title">Giorno ${day}: ${reward.title}</div>
                            <div class="success" style="font-size: 1.2em;">${reward.description}</div>
                            <audio controls class="audio-player">
                                <source src="${reward.content}" type="audio/mpeg">
                                Il tuo browser non supporta l'elemento audio.
                            </audio>
                           
                            <div style="margin-top: 20px;">
                                <button class="close-btn" onclick="closeModal()">Chiudi</button>
                            </div>
                        </div>
                    `;
                    break;

                case 'video':
                    rewardHTML = `
                        <div class="completed-view">
                            <div class="completed-icon">🎥</div>
                            <div class="problem-title">Giorno ${day}: ${reward.title}</div>
                            <div class="success" style="font-size: 1.2em;">${reward.description}</div>
                            <video controls class="video-reward">
                                <source src="${reward.content}" type="video/mp4">
                                Il tuo browser non supporta l'elemento video.
                            </video>
                            <div class="reward-message">
                                <div style="margin: 15px 0; font-style: italic;">"${reward.description}"</div>
                            </div>
                            <div style="margin-top: 20px;">
                                <button class="close-btn" onclick="closeModal()">Chiudi</button>
                            </div>
                        </div>
                    `;
                    break;

                case 'message':
                    rewardHTML = `
                        <div class="completed-view">
                            <div class="completed-icon">💌</div>
                            <div class="problem-title">Giorno ${day}: ${reward.title}</div>
                            <div class="message-reward">
                                <div style="font-size: 1.1em; line-height: 1.6;">${reward.content}</div>
                            </div>
                            
                            <div style="margin-top: 20px;">
                                <button class="close-btn" onclick="closeModal()">Chiudi</button>
                            </div>
                        </div>
                    `;
                    break;

                case 'coupon':
                    rewardHTML = `
                        <div class="completed-view">
                            <div class="completed-icon">🎫</div>
                            <div class="problem-title">Giorno ${day}: ${reward.title}</div>
                            <div class="success" style="font-size: 1.2em;">${reward.content}</div>
                            
                            <div style="margin-top: 20px;">
                                <button class="close-btn" onclick="closeModal()">Chiudi</button>
                            </div>
                        </div>
                    `;
                    break;

                case 'surprise':
                    rewardHTML = `
                        <div class="completed-view">
                            <div class="completed-icon">🎁</div>
                            <div class="problem-title">Giorno ${day}: ${reward.title}</div>
                            <div class="success" style="font-size: 1.2em;">${reward.content}</div>
                            <div class="reward-message">
                                <div style="margin: 15px 0; font-style: italic;">"${reward.description}"</div>
                            </div>
                            <div style="margin-top: 20px;">
                                <button class="close-btn" onclick="closeModal()">Chiudi</button>
                            </div>
                        </div>
                    `;
                    break;

                default:
                    rewardHTML = `
                        <div class="completed-view">
                            <div class="completed-icon">🎉</div>
                            <div class="problem-title">Giorno ${day}: Problema Completato!</div>
                            <div class="reward-message">
                                <div style="margin-bottom: 15px;">La tua ricompensa:</div>
                                <div style="font-size: 1.3em; font-weight: bold;">${reward}</div>
                            </div>
                            <div style="margin-top: 20px;">
                                <button class="close-btn" onclick="closeModal()">Chiudi</button>
                            </div>
                        </div>
                    `;
            }

            document.getElementById('problemContent').innerHTML = rewardHTML;
        }

        // Seleziona un'opzione nel quiz
        function selectOption(index) {
            selectedOption = index;
            const options = document.querySelectorAll('.quiz-option');
            options.forEach((option, i) => {
                if (i === index) {
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
            document.querySelector('.submit-btn').disabled = false;
        }

        // Invia la risposta del quiz
        function submitQuiz() {
            const problem = problems[currentDay];
            const output = document.getElementById('output');
            const rewardMessage = document.getElementById('rewardMessage');

            output.innerHTML = '';
            rewardMessage.style.display = 'none';

            if (selectedOption === problem.correctAnswer) {
                // Risposta corretta
                output.innerHTML = `<div class="success">✅ Risposta corretta!</div>`;

                // Salva il giorno come completato
                const completedDays = JSON.parse(localStorage.getItem('completedDays') || '[]');
                if (!completedDays.includes(currentDay)) {
                    completedDays.push(currentDay);
                    localStorage.setItem('completedDays', JSON.stringify(completedDays));
                }

                // Mostra la ricompensa
                showReward(problem.reward, currentDay);
            } else {
                output.innerHTML = `<div class="error">❌ Risposta errata. Riprova!</div>`;
            }
        }

        // Gestisce il tasto Tab per l'indentazione
        function handleTabKey(e) {
            if (e.key === 'Tab') {
                e.preventDefault();

                const textarea = e.target;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                // Inserisce 4 spazi al posto del tab
                textarea.value = textarea.value.substring(0, start) + '    ' + textarea.value.substring(end);

                // Posiziona il cursore dopo i 4 spazi
                textarea.selectionStart = textarea.selectionEnd = start + 4;
            }
        }

        // Chiudi la modal
        function closeModal() {
            document.getElementById('problemModal').style.display = 'none';
        }

        // Esegui il codice dell'utente
        function runCode() {
            const code = document.getElementById('codeInput').value;
            const problem = problems[currentDay];
            const output = document.getElementById('output');
            const rewardMessage = document.getElementById('rewardMessage');

            output.innerHTML = '';
            rewardMessage.style.display = 'none';

            try {
                // Esegui il codice in un ambiente controllato
                const userFunction = new Function('return ' + code)();

                let allTestsPassed = true;

                // Esegui i test cases
                problem.testCases.forEach((testCase, index) => {
                    const result = userFunction(...testCase.input);
                    const testResult = document.createElement('div');

                    if (result === testCase.expected) {
                        testResult.innerHTML = `<div class="success">✅ Test ${index + 1}: PASSATO</div>`;
                    } else {
                        testResult.innerHTML = `<div class="error">❌ Test ${index + 1}: FALLITO - Atteso: ${testCase.expected}, Ottenuto: ${result}</div>`;
                        allTestsPassed = false;
                    }

                    output.appendChild(testResult);
                });

                if (allTestsPassed) {
                    // Salva il giorno come completato
                    const completedDays = JSON.parse(localStorage.getItem('completedDays') || '[]');
                    if (!completedDays.includes(currentDay)) {
                        completedDays.push(currentDay);
                        localStorage.setItem('completedDays', JSON.stringify(completedDays));
                    }

                    // Mostra la ricompensa
                    showReward(problem.reward, currentDay);
                }

            } catch (error) {
                output.innerHTML = `<div class="error">Errore: ${error.message}</div>`;
            }
        }

        // Inizializza il calendario quando la pagina carica
        document.addEventListener('DOMContentLoaded', initCalendar);

        // Chiudi la modal cliccando fuori
        window.addEventListener('click', (event) => {
            const modal = document.getElementById('problemModal');
            if (event.target === modal) {
                closeModal();
            }
        });

        // Funzione per resettare i progressi (da console)
        function resetProgress() {
            if (confirm('Sei sicuro di voler resettare TUTTI i progressi?')) {
                localStorage.removeItem('completedDays');
                alert('Progressi resettati!');
                location.reload();
            }
        }
    </script>
</body>

</html>
