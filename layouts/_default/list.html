{{ define "title" }}{{ .Title }} — Achille Cannavale{{ end }}

{{ define "main" }}
  <main>
    {{ with .Content }}<div class="intro">{{ . }}</div>{{ end }}

    {{ if .Pages }}
      <ul class="post-list">
        {{ range .Pages }}
          <li>
            <a href="{{ .RelPermalink }}"
               data-it="{{ .Title }}"
               data-en="{{ with .Params.title_en }}{{ . }}{{ else }}{{ .Title }}{{ end }}">{{ .Title }}</a>
            <span class="post-date">{{ .Date.Format "2 Jan 2006" }}</span>
          </li>
        {{ end }}
      </ul>
    {{ else }}
      <p class="secondary" data-it="Nessun post ancora." data-en="No posts yet.">Nessun post ancora.</p>
    {{ end }}
  </main>
{{ end }}
