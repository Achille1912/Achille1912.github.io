<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var t=localStorage.getItem('theme');document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}{{ .Title }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,600;1,7..72,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}">{{ end }}
  <script src="{{ "theme.js" | relURL }}"></script>
  <script src="{{ "lang.js" | relURL }}"></script>
</head>
<body>
<div class="container">

  <header>
    <h1><a href="{{ "blog/" | relURL }}">{{ site.Title }}</a></h1>
    <nav class="menu">
      <a href="{{ "/" | relURL }}" data-it="home" data-en="home">home</a>
      <a href="{{ "/#progetti" | relURL }}" data-it="progetti" data-en="projects">progetti</a>
      <a href="{{ "blog/" | relURL }}" class="active" data-it="blog" data-en="blog">blog</a>
      <a href="{{ "/#contatti" | relURL }}" data-it="contatti" data-en="contact">contatti</a>
      <a href="https://github.com/achille1912" target="_blank" rel="noopener">github</a>
      <button id="theme-toggle">dark</button>
      <button id="lang-toggle">en</button>
    </nav>
  </header>

  {{ block "main" . }}{{ end }}

  <footer>
    <span>© {{ now.Year }} {{ site.Title }}</span>
    <a href="{{ "blog/index.xml" | relURL }}">rss</a>
  </footer>

</div>
</body>
</html>
