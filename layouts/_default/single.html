{{ define "title" }}{{ .Title }} — Achille Cannavale{{ end }}

{{ define "main" }}
  <main>
    <h2 style="margin-top:0"
        data-it="{{ .Title }}"
        data-en="{{ with .Params.title_en }}{{ . }}{{ else }}{{ .Title }}{{ end }}">{{ .Title }}</h2>
    <p class="post-meta">{{ .Date.Format "2 January 2006" }} &middot; {{ .ReadingTime }} min</p>

    <article class="post-body">
      {{ .Content }}
    </article>

    <nav class="post-nav">
      <a href="{{ "blog/" | relURL }}" data-it="← tutti i post" data-en="← all posts">← tutti i post</a>
      {{ with .NextInSection }}
        <a href="{{ .RelPermalink }}"
           data-it="{{ .Title }} →"
           data-en="{{ with .Params.title_en }}{{ . }}{{ else }}{{ .Title }}{{ end }} →">{{ .Title }} →</a>
      {{ end }}
    </nav>
  </main>
{{ end }}
